<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUT Previewer - BlackMagic Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LUT Previewer</h1>
        <p>Tải video lên, nhập LUT (.cube), xem trước và xuất.</p>
    </header>

    <main>
        <div class="controls">
            <label class="file-label">
                Chọn Video:
                <input type="file" id="videoInput" accept="video/*">
            </label>
            <label class="file-label">
                Nhập LUT (.cube):
                <input type="file" id="lutInput" accept=".cube">
            </label>
            <label>
                Cường độ LUT:
                <input type="range" id="lutIntensity" min="0" max="1" step="0.01" value="1.0">
                <span id="intensityValue">100%</span>
            </label>
            <button id="exportBtn" disabled>Xuất Video (WebM)</button>
        </div>

        <div class="preview-container">
            <video id="videoElement" controls playsinline crossorigin="anonymous"></video>
            <canvas id="canvasElement"></canvas>
        </div>
        <div id="status"></div>
    </main>

    <script src="script.js"></script>
</body>
                  </html>
